[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plnews"
version = "0.1.0"
description = "3-3-3 Democracy-Aware News Analyst"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",          # postgres (prod); sqlite works out of the box
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.12",             # article body extraction
  "beautifulsoup4>=4.12",
  "python-dateutil>=2.9",
  "anthropic>=0.40",
  "tenacity>=9.0",
  "apscheduler>=3.10",
  "python-telegram-bot>=21.6",
  "jinja2>=3.1",
  "scikit-learn>=1.5",             # tf-idf clustering fallback
  "numpy>=2.0",
  "structlog>=24.4",
  "typer>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "respx>=0.21"]

[project.scripts]
plnews = "app.cli:app"

# Without this, setuptools' flat-layout auto-discovery tries to package `data/`
# and `frontend/` and refuses to build.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
